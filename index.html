<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>保亭 · 新签商户经营总览 · 2026-11</title>
<style>
:root{
  --brand:#f2621b;--brand-2:#ff8a3d;--brand-dk:#c2410c;--brand-soft:#fff2e8;
  --bg:#fbf7f3;--panel:#fff;--ink:#241f1b;--ink-2:#6f6459;--muted:#9a8d81;
  --line:#f1e5da;--line-2:#f7eee6;
  --ok:#12855a;--ok-soft:#e7f7ef;--warn:#c47b00;--warn-soft:#fff4e0;
  --bad:#d8452c;--bad-soft:#fdeae6;--purple:#7c4ddb;--purple-soft:#f3ecff;
  --blue:#2563eb;--blue-soft:#eaf1ff;--teal:#0f766e;--teal-soft:#e6f6f4;
  --gold:#a8761a;--gold-soft:#fdf3dd;
  --r:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:0 26px}
.num,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-variant-numeric:tabular-nums}

/* ---------- hero ---------- */
.hero{background:linear-gradient(135deg,#f97316 0%,#ea580c 48%,#9a3412 100%);color:#fff;padding:26px 0 22px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-90px;top:-120px;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.10)}
.hero::after{content:"";position:absolute;left:-60px;bottom:-160px;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .wrap{position:relative;z-index:1}
.hero-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;gap:14px;align-items:center}
.logo{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
  display:grid;place-items:center;font-size:21px;font-weight:800;letter-spacing:1px;backdrop-filter:blur(2px)}
.hero h1{margin:0;font-size:23px;letter-spacing:.5px;font-weight:750}
.hero-sub{font-size:12.5px;opacity:.88;margin-top:3px}
.hero-tags{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.htag{font-size:11.5px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.26);white-space:nowrap}

/* ---------- tabs ---------- */
.tabbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(150,90,40,.05)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:13px 15px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;
  border-bottom:3px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s}
.tab:hover{color:var(--brand-dk)}
.tab.on{color:var(--brand);border-color:var(--brand)}

main{padding:22px 0 30px}
section{display:none}
section.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;
  box-shadow:0 1px 3px rgba(120,60,20,.04)}
.card-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.card-h h2{font-size:15px;margin:0;display:flex;align-items:center;gap:8px;letter-spacing:.2px}
.card-h h2::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--brand);display:inline-block}
.card-h .badge{font-size:11px;color:var(--ink-2);background:#f8efe7;border-radius:999px;padding:1px 9px}
.desc{font-size:12px;color:var(--muted);margin:2px 0 14px;line-height:1.7}
.desc b{color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:1.12fr .88fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stack{display:grid;gap:16px}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px 13px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand)}
.kpi .lbl{font-size:11.5px;color:var(--ink-2)}
.kpi .val{font-size:28px;font-weight:800;line-height:1.15;margin:2px 0 1px;letter-spacing:-.5px}
.kpi .sub{font-size:11px;color:var(--muted);line-height:1.5}
.kpi .val small{font-size:13px;font-weight:600;color:var(--ink-2);margin-left:2px}
.k-gold::before{background:var(--gold)}.k-gold .val{color:var(--gold)}
.k-ok::before{background:var(--ok)}.k-ok .val{color:var(--ok)}
.k-warn::before{background:var(--warn)}.k-warn .val{color:var(--warn)}
.k-bad::before{background:var(--bad)}.k-bad .val{color:var(--bad)}
.k-pur::before{background:var(--purple)}.k-pur .val{color:var(--purple)}
.k-blue::before{background:var(--blue)}.k-blue .val{color:var(--blue)}
.k-teal::before{background:var(--teal)}.k-teal .val{color:var(--teal)}
.k-idle::before{background:#b0a49a}.k-idle .val{color:#8c8076}

/* ---------- bars ---------- */
.bar-row{display:grid;grid-template-columns:140px 1fr 74px;gap:10px;align-items:center;margin:7px 0;font-size:12.5px}
.bar-row.wide{grid-template-columns:186px 1fr 74px}
.bar-row .nm{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .nm em{font-style:normal;color:var(--muted);font-size:11px;margin-left:4px}
.track{height:9px;border-radius:6px;background:#f7ece3;overflow:hidden;position:relative}
.track.sm{height:6px;border-radius:4px}
.fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#ffb078,#f2621b);transition:width .45s ease}
.fill.ok{background:linear-gradient(90deg,#4fd39a,#12855a)}
.fill.warn{background:linear-gradient(90deg,#ffcb5c,#c47b00)}
.fill.bad{background:linear-gradient(90deg,#ff9a83,#d8452c)}
.fill.pur{background:linear-gradient(90deg,#b998ff,#7c4ddb)}
.fill.blue{background:linear-gradient(90deg,#7ba9ff,#2563eb)}
.fill.teal{background:linear-gradient(90deg,#5fd3c8,#0f766e)}
.fill.idle{background:linear-gradient(90deg,#cfc5bb,#a1968b)}
.bar-row .val{text-align:right;font-size:12px;font-weight:600;color:var(--ink)}
.bar-row .val.mut{color:var(--muted);font-weight:400}

/* ---------- funnel ---------- */
.funnel{display:grid;gap:9px;margin-top:6px}
.fn{display:grid;grid-template-columns:104px 1fr 96px;gap:11px;align-items:center;font-size:12.5px}
.fn .fnl{color:var(--ink-2)}
.fn .fnt{height:32px;border-radius:8px;background:#f9f0e8;overflow:hidden}
.fn .fnf{height:100%;border-radius:8px;display:flex;align-items:center;padding-left:10px;color:#fff;font-weight:700;font-size:12.5px;
  background:linear-gradient(90deg,#ffb078,#f2621b);min-width:34px;transition:width .5s ease}
.fn .fnf.ok{background:linear-gradient(90deg,#4fd39a,#12855a)}
.fn .fnf.warn{background:linear-gradient(90deg,#ffcb5c,#c47b00)}
.fn .fnf.idle{background:linear-gradient(90deg,#d3c8be,#a3968a)}
.fn .fnr{text-align:right;font-size:11.5px;color:var(--muted)}

/* ---------- donut ---------- */
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:6px}
.donut{width:132px;height:132px;border-radius:50%;position:relative;flex:0 0 auto;
  background:conic-gradient(#f2621b 0 var(--a,#14%),#f6d9c4 var(--a,#14%) 100%)}
.donut::after{content:"";position:absolute;inset:15px;border-radius:50%;background:#fff}
.donut-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;z-index:1}
.donut-c b{font-size:24px;font-family:ui-monospace,Consolas,monospace;line-height:1}
.donut-c span{font-size:10.5px;color:var(--muted)}
.legend{display:grid;gap:9px;flex:1;min-width:170px}
.lg{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.lg i{width:9px;height:9px;border-radius:3px;background:#f2621b;flex:0 0 auto}
.lg i.mut{background:#f6d9c4}
.lg b{margin-left:auto;color:var(--ink);font-family:ui-monospace,Consolas,monospace}

/* ---------- chips / pills ---------- */
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;background:#f8f0e9;color:#8b7261;white-space:nowrap}
.chip.fml{background:var(--brand-soft);color:#b8490f}
.chip.gka{background:var(--purple-soft);color:#6534c0}
.chip.nrcka{background:var(--blue-soft);color:#1d4ed8}
.chip.nroth{background:var(--teal-soft);color:#0b625b}
.chip.warn{background:var(--warn-soft);color:#9a5f00}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.p-great{background:var(--ok-soft);color:#0d6b48}
.p-good{background:var(--blue-soft);color:#1d4ed8}
.p-mid{background:var(--gold-soft);color:#8a5f0d}
.p-zero{background:var(--bad-soft);color:#b23a22}
.p-idle{background:#f2eeea;color:#8a7f75}
.p-this{background:var(--brand-soft);color:#b8490f}
.sub{font-size:10.5px;color:var(--muted);line-height:1.5;margin-top:2px}
.sub-in{font-size:11px;color:var(--ink-2)}
.pos{color:var(--ok)}
.neg{color:var(--bad)}
.urgent{color:var(--bad);font-weight:700}
.mut{color:var(--muted)}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:100%}
table.tbl th{background:#fdf6f0;color:var(--ink-2);font-weight:600;text-align:left;padding:9px 11px;white-space:nowrap;
  position:sticky;top:0;z-index:2}
table.tbl th.sortable{cursor:pointer;user-select:none}
table.tbl th.sortable:hover{color:var(--brand)}
table.tbl th .arr{font-size:9px;color:var(--brand);margin-left:2px}
table.tbl td{padding:9px 11px;border-top:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
table.tbl td:first-child{white-space:normal;min-width:150px}
table.tbl.wide{min-width:1240px}
table.tbl tbody tr:hover td{background:#fffaf5}
table.tbl td.num{text-align:right;font-family:ui-monospace,Consolas,monospace;white-space:nowrap}
table.tbl tr.sum td{background:var(--gold-soft);font-weight:700}
table.tbl tr.hi td{background:#fff6ec}
.mini{display:grid;gap:3px;min-width:130px}
.mini .mrow{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-2)}
.mini .mrow span{width:86px;white-space:nowrap;font-family:ui-monospace,Consolas,monospace}
.mini .track{flex:1}
.dots{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.dot{font-size:10px;padding:1px 6px;border-radius:6px;background:#f4efea;color:#9a8d81}
.dot.ok{background:var(--ok-soft);color:#0d6b48}
.dot.no{background:#f8f0e9;color:#a99c90}

/* ---------- filters ---------- */
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input,.filters select{padding:7px 11px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;background:#fff;color:var(--ink);
  font-family:inherit;outline:none}
.filters input{min-width:210px}
.filters input:focus,.filters select:focus{border-color:#f5ab80;box-shadow:0 0 0 3px #fdeee3}
.filters .cnt{font-size:12px;color:var(--muted);margin-left:auto}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink-2);
  cursor:pointer;font-family:inherit;transition:.15s}
.seg button:hover{border-color:#f5ab80}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}

/* ---------- rank cards ---------- */
.rank-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:12px}
.rank{background:linear-gradient(165deg,#fff 0%,#fffaf6 100%);border:1px solid var(--line);border-radius:14px;padding:14px 15px}
.rank .top{display:flex;align-items:center;gap:8px}
.rank .medal{font-size:17px;line-height:1}
.rank .nm{font-size:15px;font-weight:750}
.rank .score{font-size:24px;font-weight:800;font-family:ui-monospace,Consolas,monospace;color:var(--brand-dk);margin:6px 0 0}
.rank .score small{font-size:11px;color:var(--muted);font-weight:500;font-family:inherit;margin-left:4px}
.rank .meta{display:flex;gap:12px;font-size:11.5px;color:var(--ink-2);margin-top:6px;flex-wrap:wrap}
.rank .meta b{color:var(--ink);font-family:ui-monospace,Consolas,monospace}

/* ---------- misc ---------- */
.note{background:#fdf7f2;border-left:3px solid var(--brand);border-radius:8px;padding:10px 13px;font-size:12px;color:var(--ink-2);line-height:1.8;margin-top:12px}
.note.warn{border-color:var(--bad);background:#fdf1ee}
.note.ok{border-color:var(--ok);background:#f0faf5}
.note.gold{border-color:var(--gold);background:#fdf8ec}
.note b{color:var(--ink)}
.todo{display:grid;gap:8px}
.todo-i{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;background:#fdf9f5;border:1px solid var(--line-2);font-size:12.5px}
.todo-i .tag{flex:0 0 auto;font-size:10.5px;padding:1px 8px;border-radius:999px;font-weight:700;margin-top:1px}
.tag.bad{background:var(--bad-soft);color:#b23a22}
.tag.warn{background:var(--warn-soft);color:#9a5f00}
.tag.info{background:var(--blue-soft);color:#1d4ed8}
.tag.ok{background:var(--ok-soft);color:#0d6b48}
.todo-i .t{color:var(--ink)}
.todo-i .t em{font-style:normal;color:var(--muted);font-size:11px;margin-left:6px}
.mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mini-box{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fffdfb}
.mini-box .lbl{font-size:11px;color:var(--muted)}
.mini-box .v{font-size:20px;font-weight:800;font-family:ui-monospace,Consolas,monospace;margin:2px 0}
.mini-box .s{font-size:10.5px;color:var(--muted);line-height:1.5}
.mini-box.danger .v{color:var(--bad)}
.mini-box.ok .v{color:var(--ok)}
.mini-box.gold .v{color:var(--gold)}
.mini-box.pur .v{color:var(--purple)}
.mini-box.blue .v{color:var(--blue)}
.bl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.bl-card{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fffdfb}
.bl-card .hd{display:flex;align-items:baseline;gap:6px;margin-bottom:2px}
.bl-card .hd b{font-size:13.5px;color:var(--ink)}
.bl-card .hd span{font-size:10.5px;color:var(--muted)}
.bl-card .n{font-size:11px;color:var(--muted);margin-bottom:7px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sf{background:#fffdfb;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:11px;color:var(--muted);min-width:92px}
.sf b{display:block;font-size:15px;color:var(--brand-dk);font-family:ui-monospace,Consolas,monospace;margin-top:1px}
footer{padding:20px 0 34px;color:#a89a8d;font-size:11.5px;text-align:center;line-height:1.9;border-top:1px solid var(--line)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:12.5px;color:var(--ink-2)}
.kv b{color:var(--ink)}
.rules p{margin:0 0 8px;font-size:12.5px;color:var(--ink-2);line-height:1.8}
.rules p b{color:var(--ink)}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}

@media (max-width:1024px){
  .grid2,.grid3{grid-template-columns:1fr}
  .hero h1{font-size:20px}
}
@media (max-width:720px){
  .wrap{padding:0 14px}
  main{padding:16px 0 24px}
  .hero{padding:18px 0 16px}
  .hero h1{font-size:18px}
  .logo{width:38px;height:38px;font-size:17px;border-radius:11px}
  .hero-tags{display:none}
  .card{padding:14px 14px;border-radius:14px}
  .kpi .val{font-size:24px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  .bar-row{grid-template-columns:92px 1fr 58px;gap:8px;font-size:11.5px}
  .fn{grid-template-columns:76px 1fr 74px;gap:8px;font-size:11.5px}
  .fn .fnt{height:28px}
  .fn .fnf{font-size:11.5px;padding-left:7px}
  .hide-sm{display:none}
  table.tbl{font-size:11.5px}
  table.tbl th,table.tbl td{padding:7px 8px}
  .filters input{min-width:130px;flex:1}
  .donut{width:112px;height:112px}
}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="hero-row">
      <div class="brand">
        <div class="logo">保</div>
        <div>
          <h1>保亭 · 新签商户经营总览</h1>
          <div class="hero-sub">11 月新签考核 × BD 绩效 × 综合指标 × 营销 KPI　·　城市分层「反超」　·　渠道经理 何世祥</div>
        </div>
      </div>
      <div class="hero-tags">
        <span class="htag">数据日 2026-11-05</span>
        <span class="htag" id="hMer">商户 20 家</span>
        <span class="htag" id="hPool">入考核池 15 家</span>
      </div>
    </div>
  </div>
</header>

<div class="tabbar"><div class="wrap"><nav class="tabs" id="tabs"></nav></div></div>

<main><div class="wrap" id="app"></div></main>

<footer>
  数据来源：新签考核明细（日 20261105）· 新签登记表 · 26年11月BD考核方案 · 11月综合指标看板 · 11月爆单红包考核进度（五城）<br>
  本页为单文件离线看板，配色与图表均为本地渲染，无需联网 · 生成于 2026-11-07
</footer>

function hintTags(m){
  const a=[];
  if(typeof m.days==='number'&&m.days<=4)a.push(['bad','剩 '+m.days+' 天']);
  if(!m.assess)a.push(['warn','未入池']);
  else if(!hasOrder(m))a.push(['bad','待破零']);
  else if(m.tord&&m.ord<m.tord)a.push(['info','差 '+(m.tord-m.ord)+' 单']);
  if(m.tgmv&&m.gmv<m.tgmv&&m.live)a.push(['info','净G 差 '+nf(Math.round(m.tgmv-m.gmv))]);
  if(m.hrs!=null&&m.hrs<42&&m.assess)a.push(['warn','营业 '+fx(m.hrs)+'h']);
  return a.slice(0,3).map(t=>'<span class="chip '+(t[0]==='bad'?'warn':'')+'">'+t[1]+'</span>').join(' ');
}

function filtered(){
  const f=ST.f;
  const list=M.filter(m=>{
    if(f.bucket&&m.bucket!==f.bucket)return false;
    if(f.bd&&m.bd!==f.bd)return false;
    if(f.bl&&m.bl!==f.bl)return false;
    if(f.q){
      const t=(m.name+' '+m.cat+' '+m.bd+' '+m.bl+' '+m.id).toLowerCase();
      if(t.indexOf(f.q.toLowerCase())<0)return false;
    }
    return true;
  });
  const k=ST.sort.k,dir=ST.sort.dir;
  const val=m=>k==='score'?score(m):(k==='days'?dnum(m):m[k]);
  list.sort((a,b)=>{
    const av=val(a),bv=val(b);
    if(typeof av==='number'&&typeof bv==='number')return (av-bv)*dir;
    return String(av).localeCompare(String(bv),'zh')*dir;
  });
  return list;
}

  const max=isRate?100:Math.max.apply(null,bdRows.map(r=>r[col[0]]||0));
  return bdRows.map(r=>{
    const v=r[col[0]];
    const txt=v==null?'—':(isRate?v+'%':nf(v));
    return bar(r.nm,txt,v==null?null:(v/max),v==null?'idle':'',isRate?'':'占保亭合计 '+fx(v/ (MR[5][col[0]]||1)*100)+'%');
  }).join('');
}

/* ---------- 绑定与渲染 ---------- */
function fillRows(){
  const list=filtered();
  const body=document.getElementById('mBody');
  if(!body)return;
  body.innerHTML=list.length?list.map(merchantRow).join(''):'<tr><td colspan="9" class="mut" style="text-align:center;padding:28px">没有匹配的商户</td></tr>';
  document.getElementById('mCount').textContent=list.length+' 家';
  document.getElementById('mCount2').textContent='显示 '+list.length+' / '+M.length;
}
function bindMerchants(){
  const segs=document.querySelectorAll('#mSeg button');
  segs.forEach(b=>b.onclick=()=>{
    ST.f.bucket=b.dataset.b;
    segs.forEach(x=>x.classList.toggle('on',x===b));
    fillRows();
  });
  const q=document.getElementById('fq');
  q.oninput=e=>{ST.f.q=e.target.value;fillRows();};
  const bd=document.getElementById('fbd');
  bd.onchange=e=>{ST.f.bd=e.target.value;fillRows();};
  const bl=document.getElementById('fbl');
  bl.onchange=e=>{ST.f.bl=e.target.value;fillRows();};
  document.querySelectorAll('#mTable th.sortable').forEach(th=>{
    th.onclick=()=>{
      const k=th.dataset.k;
      ST.sort=ST.sort.k===k?{k:k,dir:-ST.sort.dir}:{k:k,dir:-1};
      document.querySelectorAll('#mTable th.sortable .arr').forEach(a=>a.textContent='');
      const arr=th.querySelector('.arr');
      if(arr)arr.textContent=ST.sort.dir>0?'▲':'▼';
      fillRows();
    };
  });
  const initArr=document.querySelector('#mTable th[data-k="'+ST.sort.k+'"] .arr');
  if(initArr)initArr.textContent=ST.sort.dir>0?'▲':'▼';
  fillRows();
}
function bindBD(){
  const segs=document.querySelectorAll('#bdSeg button');
  segs.forEach(b=>b.onclick=()=>{
    ST.bdPerf=b.dataset.n;
    segs.forEach(x=>x.classList.toggle('on',x===b));
    document.getElementById('bdPerfBody').innerHTML=perfBody();
  });
}
function bindMetrics(){
  const sel=document.getElementById('mSel');
  if(!sel)return;
  sel.value=ST.metric;
  sel.onchange=e=>{ST.metric=e.target.value;document.getElementById('mChart').innerHTML=metricChart();};
}
function render(){
  const hm=document.getElementById('hMer'),hp=document.getElementById('hPool');
  if(hm)hm.textContent='商户 '+M.length+' 家';
  if(hp)hp.textContent='入考核池 '+inPool+' 家';
  document.getElementById('app').innerHTML=views[ST.tab]();
  document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.toggle('on',t.dataset.t===ST.tab));
  if(ST.tab==='merchants')bindMerchants();
  if(ST.tab==='bd')bindBD();
  if(ST.tab==='metrics')bindMetrics();
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('tabs').innerHTML=TABS.map(t=>'<div class="tab" data-t="'+t[0]+'">'+t[1]+'</div>').join('');
document.getElementById('tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab');
  if(!t)return;
  ST.tab=t.dataset.t;
  render();
});
render();
})();
